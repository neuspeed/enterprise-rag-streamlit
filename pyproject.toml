[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "know-everything-ai"
version = "1.0.0"
description = "Knowledge pipeline: ingest documents, branch by size, store in Flowise"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "aiofiles>=23.2.1",
  "aiohttp>=3.9.5",
  "aio_pika>=9.4.0",
  "aiormq>=6.8.0",
  "backoff>=2.2.1",
  "beautifulsoup4>=4.12.3",
  "chardet>=5.2.0",
  "httpx>=0.27.0",
  "lxml>=5.3.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pdf2image>=1.17.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-docx>=1.1.2",
  "structlog>=24.4.0",
  "tiktoken>=0.7.0",
  "yarl>=1.9.4",
  # Vector store + local embeddings, both on the ingest path: the vector branch
  # embeds chunks while writing them, so they cannot live in an optional extra.
  "fastembed>=0.6.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "psycopg_pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "types-aiofiles>=23.2.1",
  # The query API is covered by HTTP tests, and its stack is not in the core
  # dependencies, so the dev runtime has to carry it.
  "fastapi>=0.115",
]
# Sandbox dashboard only. Kept out of requirements.txt so the production worker
# image does not carry a web framework it never imports.
ui = [
  "streamlit>=1.40",
]
# Query API, same reasoning as `ui`: only the `api` image stage installs it.
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
kb-pipeline = "know_everything_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["know_everything_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

# FastAPI's `Depends(...)` in an argument default is the idiomatic way to wire
# dependencies, not the anti-pattern B008 describes.
[tool.ruff.lint.per-file-ignores]
"know_everything_ai/api/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ['tests/']